name: Refresh FDE questions

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-fde-questions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest tests/test_update_questions.py -v
      - name: Refresh public Aced dataset
        run: python scripts/update_questions.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No question changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh FDE questions"
          git push
